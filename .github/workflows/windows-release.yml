name: Build Nora Studio Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Verify release tag matches version
        shell: pwsh
        run: |
          $iss = Get-Content 'windows/NoraStudio.iss' -Raw
          if ($iss -notmatch '#define AppVersion "(\d+\.\d+\.\d+)"') {
            throw 'Cannot determine version in windows/NoraStudio.iss.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw 'Release tag does not match AppVersion.'
          }

      - name: Build EXE and installer
        shell: cmd
        run: call windows\Build-Installer.bat --no-pause

      - name: Preserve installer even if release publication fails
        uses: actions/upload-artifact@v4
        with:
          name: NoraStudio-Setup
          path: installer-output/NoraStudio-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $iss = Get-Content 'windows/NoraStudio.iss' -Raw
          if ($iss -notmatch '#define AppVersion "(\d+\.\d+\.\d+)"') { throw 'Missing app version.' }
          $version = $Matches[1]
          $tag = "v$version"
          $asset = "installer-output/NoraStudio-Setup-$version.exe"
          if (-not (Test-Path $asset)) { throw "Installer not found: $asset" }
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $asset --clobber
            } else {
              gh release create $tag $asset --target $env:GITHUB_SHA --title "Nora Studio $version" --generate-notes
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 4) {
              Write-Warning "GitHub Release API failed. Retrying attempt $($attempt + 1) of 4."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          throw 'GitHub Release publication failed after 4 attempts. Installer is available as a workflow artifact.'
