<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nora Studio · Company OS</title>
<style>
:root{font-family:'Segoe UI','Malgun Gothic',sans-serif;color:#edf0fa;background:#0d111b;font-size:14px;--panel:#181e2b;--line:#303a4b;--muted:#9ba9bf;--accent:#9280ff}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.shell{display:flex;min-height:100vh}.side{width:244px;flex-shrink:0;background:#121824;border-right:1px solid var(--line);padding:23px 13px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:8px 12px 30px;display:flex;gap:12px;align-items:center;font-size:18px;font-weight:800}.brand-icon{border-radius:11px;background:linear-gradient(135deg,#9f8aff,#5666c8);padding:10px;color:white}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.8px;margin-top:4px}.nav-label{color:#687a96;font-size:10px;letter-spacing:1.5px;margin:14px 15px 8px;font-weight:700}.nav{display:block;width:100%;text-align:left;color:#a8b6cc;background:transparent;border:0;padding:12px 15px;border-radius:9px;margin-bottom:5px}.nav:hover,.nav.active{background:#2c2945;color:#d4caff}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:17px 12px;color:#9eaec2;font-size:12px;line-height:1.6}
.main{min-width:0;flex:1}.top{border-bottom:1px solid var(--line);padding:20px 34px;display:flex;align-items:center;justify-content:space-between;background:#121824}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:#50cba2;margin-right:7px}.content{padding:32px;max-width:1510px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:25px}.kicker{color:#a898ff;font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:29px;margin:8px 0}h2{font-size:16px;margin:0}h3{font-size:15px;margin:0 0 8px}p{line-height:1.65}.muted,small{color:var(--muted)}.btn{border:1px solid #a092ff;border-radius:8px;padding:9px 13px;background:#8272e9;color:white;font-weight:700}.btn.alt{background:#252f41;border-color:#405069;color:#d7e0f1}.btn.danger{background:#402833;border-color:#7b4453;color:#ffc6d1}.btn.mini{font-size:12px;padding:6px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:21px}.card .value{font-size:30px;font-weight:800;margin:12px 0}.card .label{color:var(--muted);font-size:12px}.card .hint{font-size:11px;color:#788ba6}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:18px}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:13px}.block{background:#1d2736;border:1px solid #39455a;padding:17px;border-radius:11px;margin-top:12px}.badge{display:inline-block;color:#d5caff;background:#34314e;border:1px solid #514970;padding:4px 9px;font-size:11px;border-radius:20px;font-weight:700}.badge.done{background:#193b32;color:#61dab3;border-color:#2b6050}.badge.review{background:#4b3723;color:#ffcc80;border-color:#71502e}.badge.rejected{background:#4a2934;color:#ffafc4;border-color:#6c4150}.progress{height:8px;border-radius:20px;background:#343f52;overflow:hidden;margin:11px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#7468d8,#ab95ff)}.empty{text-align:center;padding:35px 8px;color:#8394ae}.activity{padding:12px 0;border-bottom:1px solid #2b3444;display:flex;gap:12px}.activity:last-child{border:0}.activity .bullet{background:#353453;color:#b9acff;display:grid;place-items:center;border-radius:8px;width:30px;height:30px;flex-shrink:0}.activity p{margin:0;font-size:12px}.activity small{font-size:10px}a{color:#b3a4ff;word-break:break-word}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.input{background:#101722;border:1px solid #455268;color:#edf0fa;padding:11px;border-radius:8px;width:100%;outline:0}.form{display:grid;gap:11px}.form label{color:#b6c4d9;font-size:12px}.form textarea{min-height:95px;resize:vertical}.modal-wrap{position:fixed;inset:0;background:#02060acb;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#1b2432;border:1px solid #556179;border-radius:17px;padding:25px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;padding:14px 20px;background:#344266;border:1px solid #7b87b8;border-radius:11px;z-index:30;max-width:470px}.filter{max-width:280px}.tagline{color:#a6b4cb;font-size:12px}.metric{font-size:12px;color:#aab9cd}.feature-text{white-space:pre-wrap;font-size:12px;color:#b5c2d8}.pill{display:inline-block;border:1px solid #536078;padding:4px 8px;border-radius:18px;color:#aebed8;font-size:11px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr}}@media(max-width:700px){.side{width:68px;padding:14px 5px}.brand{padding:5px;font-size:0}.brand small,.nav-label,.side-foot{display:none}.brand-icon{font-size:17px}.nav{font-size:0;text-align:center}.nav::first-letter{font-size:20px}.content{padding:19px}.top{padding:17px}.head{align-items:start;flex-direction:column}}@media(max-width:420px){.cards{grid-template-columns:1fr 1fr}.card{padding:14px}.card .value{font-size:23px}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand"><div class="brand-icon">✦</div><div>Nora Studio<small>COMPANY OS</small></div></div><div class="nav-label">OPERATIONS</div><nav id="nav"></nav><div class="side-foot"><span class="dot"></span>Local-first Studio<br>개발은 Codex · 운영은 Nora</div></aside><div class="main"><header class="top"><div id="crumb">CEO 대시보드</div><div><span id="status" class="pill">연결 중</span> <span class="badge">N · CEO</span></div></header><main class="content" id="content"></main></div></div>
<div id="modal" class="modal-wrap hidden"><div class="modal"><div class="row"><h2 id="modal-title"></h2><button class="btn alt mini" onclick="closeModal()">닫기 ✕</button></div><div id="modal-body" style="margin-top:20px"></div></div></div><div class="toast hidden" id="toast"></div>
<script>
const NAV=[['office','✦ 대표 집무실'],['automation','◉ 직원 활동 현황'],['notifications','♧ 대표 알림 센터'],['reports','▤ 부서 보고'],['decisions','✓ 전자결재'],['calendar','◷ 회사 일정'],['dashboard','◫ 경영 현황'],['projects','▦ 프로젝트'],['milestones','◷ 마일스톤'],['features','✓ 기능 검수'],['github','⑂ GitHub 활동'],['history','▤ 이전 업무 기록'],['settings','⚙ 회사 설정']];
let page='office',token='',guest=true,selectedProject='',store={projects:[],milestones:[],features:[],commits:[],tasks:[],dashboard:{recent:[]},health:{},executive:{reports:[],decisions:[],events:[],past_days:[],snapshot:{}},automation:{jobs:[],reports:[],notifications:[],departments:[]}};let updateInfo={current:'0.7.0',available:false};let ghAuth={configured:false,source:'none'};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const statusText={idea:'기획',prototype:'프로토타입',production:'개발',testing:'테스트',released:'출시',planned:'계획',active:'진행',done:'완료',verified:'검증 완료',review:'검수 대기',rejected:'반려'};
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4500)}
async function api(path,method='GET',body){if(method!=='GET'&&!token)throw Error('관리자 토큰으로 로그인한 후 변경할 수 있습니다.');const res=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{'X-Nora-Token':token}:{})},body:body===undefined?undefined:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.detail||'요청 실패');return data}
async function reload(){try{const paths=['/projects','/milestones','/features','/github-activity','/tasks','/dashboard','/health','/executive/overview','/automation/overview'];const vals=await Promise.all(paths.map(x=>api(x)));['projects','milestones','features','commits','tasks','dashboard','health','executive','automation'].forEach((k,i)=>store[k]=vals[i]);guest=store.health.role!=='admin';ghAuth=guest?{configured:false,source:'none'}:await api('/github/credentials').catch(()=>({configured:false,source:'unavailable'}));const n=store.automation.notifications.filter(x=>!x.is_read).length;$('status').textContent=(guest?'게스트 · 읽기 전용':'관리자 · 경영 모드')+(n?' · 알림 '+n:'');draw()}catch(ex){toast('조회 실패: '+ex.message)}}
function changePage(name){page=name;renderNav();draw()}
function renderNav(){$('nav').innerHTML=NAV.map(([id,name])=>`<button class="nav ${page===id?'active':''}" onclick="changePage('${id}')">${name}</button>`).join('');$('crumb').textContent=NAV.find(x=>x[0]===page)?.[1]||''}
function badge(s){return `<span class="badge ${s==='verified'||s==='done'?'done':s==='review'?'review':s==='rejected'?'rejected':''}">${esc(statusText[s]||s)}</span>`}
function heading(name,subtitle,buttons=''){return `<div class="head"><div><div class="kicker">NORA STUDIO · COMPANY OS</div><h1>${esc(name)}</h1><p class="muted" style="margin:0">${esc(subtitle)}</p></div><div class="actions">${buttons}</div></div>`}
function metric(name,value,hint){return `<div class="card"><div class="label">${esc(name)}</div><div class="value">${esc(value)}</div><div class="hint">${esc(hint)}</div></div>`}
const verified=p=>store.features.filter(f=>f.project_id===p.id&&f.status==='verified').length;
const featureCount=p=>store.features.filter(f=>f.project_id===p.id).length;
const pct=p=>featureCount(p)?Math.round(verified(p)/featureCount(p)*100):0;
function selected(){return selectedProject?Number(selectedProject):null}
function projectFilter(){return `<select class="input filter" onchange="selectedProject=this.value;draw()"><option value="">전체 프로젝트</option>${store.projects.map(p=>`<option value="${p.id}" ${String(selectedProject)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function shown(items){return selected()?items.filter(x=>x.project_id===selected()):items}
function activityBlock(records){return records.length?records.map(x=>`<div class="activity"><span class="bullet">✦</span><div><p>${esc(x.message)}</p><small>${esc(x.created_at||'')}</small></div></div>`).join(''):'<div class="empty">활동 기록이 없습니다.</div>'}
function dashboard(){const d=store.dashboard;const total=store.features.length,good=store.features.filter(f=>f.status==='verified').length,review=store.features.filter(f=>f.status==='review').length;return heading('안녕하세요, 노라 대표님. ✦','프로젝트 개발 현황을 근거 중심으로 확인하세요.')+`<div class="cards">${metric('운영 프로젝트',store.projects.length,'게임 개발 포트폴리오')}${metric('검증된 기능',`${good} / ${total}`,'대표 검수 통과 기준')}${metric('검수 대기',review,'대표 확인 필요')}${metric('일정 지연',d.overdue_milestones||0,'완료되지 않은 기한 경과')}</div><div class="grid"><section class="panel"><div class="row"><h2>프로젝트 구현 현황</h2><button class="btn alt mini" onclick="changePage('projects')">전체 프로젝트</button></div>${store.projects.map(p=>`<div class="block"><div class="row"><strong>${esc(p.name)}</strong>${badge(p.stage)}</div><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="row metric"><span>검수 통과 ${verified(p)} / ${featureCount(p)}개 기능</span><strong>${pct(p)}%</strong></div></div>`).join('')||'<div class="empty">프로젝트를 등록해 주세요.</div>'}<p class="tagline">※ 코드량이 아닌 등록된 기능 중 대표 검수를 통과한 비율입니다.</p></section><section class="panel"><div class="row"><h2>경영 활동 기록</h2><span class="pill">최근 12건</span></div>${activityBlock(d.recent||[])}</section></div>`}
function projects(){return heading('프로젝트 포트폴리오','프로젝트별 단계, GitHub 저장소, 검증 완료율을 관리합니다.',`<button class="btn" onclick="projectEditor()">+ 프로젝트 등록</button>`)+`<div class="two">${store.projects.map(p=>`<div class="panel"><div class="row"><h3>${esc(p.name)}</h3>${badge(p.stage)}</div><p class="muted">${esc(p.description||'설명 없음')}</p><p class="metric">GitHub: ${p.github_repo?`<a href="https://github.com/${esc(p.github_repo)}" target="_blank" rel="noopener noreferrer">${esc(p.github_repo)}</a>`:'미연결'}</p><div class="progress"><span style="width:${pct(p)}%"></span></div><div class="row metric"><span>검증 ${verified(p)} / ${featureCount(p)}개</span><strong>${pct(p)}%</strong></div><div class="actions" style="margin-top:17px"><button class="btn alt mini" onclick="projectEditor(${p.id})">설정</button><button class="btn mini" onclick="syncGithub(${p.id})" ${!p.github_repo?'disabled':''}>GitHub 동기화</button><button class="btn alt mini" onclick="selectedProject='${p.id}';changePage('features')">기능 보기</button></div></div>`).join('')||'<div class="empty">등록된 프로젝트가 없습니다.</div>'}</div>`}
function milestones(){return heading('마일스톤','개발 목표와 기한을 관리하고 검증된 결과로 완료를 판단합니다.',`${projectFilter()}<button class="btn" onclick="milestoneEditor()">+ 마일스톤</button>`)+`<div class="two">${shown(store.milestones).map(m=>`<div class="panel"><div class="row"><h3>${esc(m.title)}</h3>${badge(m.status)}</div><p class="metric">${esc(store.projects.find(p=>p.id===m.project_id)?.name||'')} · 기한 ${esc(m.due_date||'미지정')}</p><div class="progress"><span style="width:${m.feature_count?Math.round(m.verified_count/m.feature_count*100):0}%"></span></div><p class="metric">검증된 기능 ${m.verified_count}/${m.feature_count}개</p><div class="actions"><button class="btn alt mini" onclick="setMilestone(${m.id},'active')">진행 중</button><button class="btn mini" onclick="setMilestone(${m.id},'done')">완료 처리</button></div></div>`).join('')||'<div class="empty">마일스톤을 추가해 주세요.</div>'}</div>`}
function featureItem(f){const p=store.projects.find(p=>p.id===f.project_id),m=store.milestones.find(m=>m.id===f.milestone_id);return `<article class="block"><div class="row"><h3>${esc(f.title)}</h3>${badge(f.status)}</div><p class="metric">${esc(p?.name||'')} ${m?'· '+esc(m.title):''}</p><div class="feature-text">${esc(f.criteria)}</div>${f.evidence_url?`<p class="metric">근거: <a target="_blank" rel="noopener noreferrer" href="${esc(f.evidence_url)}">${esc(f.evidence_url)}</a></p>`:''}${f.review_note?`<p class="metric">검수 메모: ${esc(f.review_note)}</p>`:''}<div class="actions">${f.status!=='review'?`<button class="btn alt mini" onclick="submitEditor(${f.id})">근거 제출</button>`:`<button class="btn mini" onclick="reviewEditor(${f.id},'accept')">검수 승인</button><button class="btn danger mini" onclick="reviewEditor(${f.id},'reject')">반려</button>`}</div></article>`}
function features(){const list=shown(store.features);return heading('기능 완료 조건 및 검수','커밋이 존재한다는 이유만으로 완료 처리하지 않습니다.',`${projectFilter()}<button class="btn" onclick="featureEditor()">+ 기능 정의</button>`)+`<div class="cards">${metric('등록된 기능',list.length,'명시적인 완료 조건')}${metric('검수 완료',list.filter(x=>x.status==='verified').length,'대표 승인')}${metric('검수 대기',list.filter(x=>x.status==='review').length,'근거 제출됨')}${metric('추가 확인',list.filter(x=>x.status==='rejected').length,'반려된 결과')}</div><div class="two">${list.map(featureItem).join('')||'<div class="empty">완료 조건을 등록해 주세요.</div>'}</div>`}
function github(){const commits=shown(store.commits);return heading('GitHub 개발 활동','GitHub 저장소의 커밋을 읽기 전용으로 수집합니다. 커밋 수는 완성률이 아닙니다.',`${projectFilter()}<button class="btn alt" onclick="changePage('projects')">저장소 연결 설정</button>`)+`<div class="panel"><h2>수집된 커밋 ${commits.length}개 (최근 100개 표시)</h2>${commits.map(c=>`<div class="activity"><span class="bullet">⑂</span><div><p><a target="_blank" rel="noopener noreferrer" href="${esc(c.url)}">${esc(c.message)}</a></p><small>${esc(c.author)} · ${esc(c.committed_at)} · ${esc(c.sha.slice(0,8))}</small></div></div>`).join('')||'<div class="empty">프로젝트에 GitHub 저장소를 연결한 후 동기화하세요.</div>'}</div>`}
function history(){return heading('이전 업무 기록','v0.4.0 이전 SQLite 기록을 읽기 전용으로 보존합니다. AI 직접 실행은 제거되었습니다.')+`<div class="panel">${store.tasks.map(t=>`<article class="block"><div class="row"><strong>#${t.id} ${esc(t.title)}</strong>${badge(t.status)}</div><p class="muted">${esc(t.description)}</p><details><summary>기존 작업 로그 보기</summary><pre style="white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto">${esc(t.log||'로그 없음')}</pre></details></article>`).join('')||'<div class="empty">보존된 과거 업무가 없습니다.</div>'}</div>`}
function dayStatus(){const d=store.executive.workday;return d?(d.ended_at?'퇴근 완료':'근무 중'):'출근 전'}
function office(){const x=store.executive,d=x.workday,s=x.snapshot||{},today=x.today||'',brief=x.reports.find(r=>r.workday_id===d?.id&&r.title==='출근 브리핑');const pending=x.reports.filter(r=>r.status==='pending').length+x.decisions.filter(r=>r.status==='pending').length;return heading('대표 집무실 · Executive Office','Nora Studio에 오신 것을 환영합니다. 대표님의 하루를 시작하세요.',`<span class="pill">${esc(today)} · ${dayStatus()}</span>`)+`<div class="cards">${metric('대표 결재 대기',pending,'보고서 및 경영 안건')}${metric('운영 프로젝트',s.projects||0,'현재 등록된 프로젝트')}${metric('검수 대기 기능',s.review_features||0,'검수 시스템 연동')}${metric('일정 지연',s.overdue_milestones||0,'마일스톤 근거')}</div><div class="grid"><div class="stack"><section class="panel"><div class="row"><h2>CEO 출근 · 퇴근</h2>${badge(dayStatus())}</div>${!d?`<p class="muted">오늘의 목표를 설정하고 출근 브리핑을 생성합니다.</p><div class="actions"><button class="btn" onclick="clockIn()">✦ 출근하기</button></div>`:d.ended_at?`<p class="muted">오늘의 업무가 종료되었습니다. 내일 새로운 업무일을 시작할 수 있습니다.</p><p>${esc(d.end_summary||'')}</p><p class="metric">퇴근 메모: ${esc(d.end_note||'없음')}</p>`:`<p class="muted">출근 ${esc(d.started_at)} · 오늘의 목표: ${esc(d.focus||'미설정')}</p><button class="btn alt" onclick="clockOut()">퇴근 보고 작성</button>`}</section><section class="panel"><div class="row"><h2>오늘의 출근 브리핑</h2><span class="pill">SQLite 실제 데이터</span></div>${brief?`<p>${esc(brief.body)}</p><details><summary class="metric">근거 데이터 보기</summary><pre style="white-space:pre-wrap;max-height:240px;overflow:auto">${esc(brief.evidence_json)}</pre></details>`:'<div class="empty">출근하면 오늘의 브리핑이 작성됩니다.</div>'}</section><section class="panel"><div class="row"><h2>부서장 보고</h2><button class="btn alt mini" onclick="changePage('reports')">보고서 보기</button></div><p class="muted">프로젝트 데이터에 기반한 보고서를 요청하고 대표가 결재합니다.</p><div class="actions">${[['operations','운영실장'],['development','개발팀장'],['design','기획자'],['qa','QA팀장']].map(([id,name])=>`<button class="btn alt mini" ${!d||d.ended_at?'disabled':''} onclick="generateReport('${id}')">${name} 보고 요청</button>`).join('')}</div></section></div><div class="stack"><section class="panel"><div class="row"><h2>결재함</h2><button class="btn alt mini" onclick="changePage('decisions')">전체 보기</button></div>${[...x.reports.filter(y=>y.status==='pending').slice(0,3).map(r=>`<div class="activity"><span class="bullet">▤</span><div><p>${esc(r.title)}</p><small>보고서 승인 대기</small></div></div>`),...x.decisions.filter(y=>y.status==='pending').slice(0,3).map(r=>`<div class="activity"><span class="bullet">✓</span><div><p>${esc(r.subject)}</p><small>경영 안건 승인 대기</small></div></div>`)].join('')||'<div class="empty">대기 중인 결재가 없습니다.</div>'}</section><section class="panel"><div class="row"><h2>오늘의 일정</h2><button class="btn alt mini" onclick="changePage('calendar')">일정 관리</button></div>${x.events.filter(e=>e.event_date===today&&e.status==='scheduled').map(e=>`<div class="activity"><span class="bullet">◷</span><div><p>${esc(e.title)}</p><small>${esc(e.event_time||'시간 미지정')} · ${esc(e.category)}</small></div></div>`).join('')||'<div class="empty">오늘 등록된 일정이 없습니다.</div>'}</section></div></div>`}
function reports(){const x=store.executive,d=x.workday;return heading('부서 보고실','AI 직원의 제안과 사실 기반 브리핑을 구분해 확인합니다.',`<button class="btn alt" onclick="changePage('office')">대표 집무실</button>`)+`<div class="panel"><div class="row"><h2>부서별 보고 요청</h2><span class="pill">${esc(dayStatus())}</span></div><div class="actions" style="margin-top:16px">${[['operations','운영실장'],['development','개발팀장'],['design','기획자'],['qa','QA팀장']].map(([id,name])=>`<button class="btn alt mini" ${!d||d.ended_at?'disabled':''} onclick="generateReport('${id}')">${name} 보고 생성</button>`).join('')}</div><p class="tagline">로컬 Ollama는 선택 사항입니다. 미연결 시 사실 기반 브리핑을 생성하며 AI 분석으로 표시하지 않습니다.</p></div><div class="two">${x.reports.map(r=>`<article class="panel"><div class="row"><h3>${esc(r.title)}</h3>${badge(r.status)}</div><p class="metric">${esc(r.created_at)} · ${r.generator==='ollama'?'Ollama AI 초안':'규칙 기반 사실 브리핑'}</p><p class="feature-text">${esc(r.body)}</p><details><summary class="metric">근거 데이터</summary><pre style="white-space:pre-wrap;max-height:230px;overflow:auto">${esc(r.evidence_json)}</pre></details>${r.decision_note?`<p class="metric">결재 메모: ${esc(r.decision_note)}</p>`:''}${r.status==='pending'?`<div class="actions" style="margin-top:14px"><button class="btn mini" onclick="reviewExecutive('reports',${r.id},'approved')">승인</button><button class="btn danger mini" onclick="reviewExecutive('reports',${r.id},'rejected')">반려</button></div>`:''}</article>`).join('')||'<div class="empty">아직 보고서가 없습니다.</div>'}</div>`}
function decisions(){const x=store.executive;return heading('대표 전자결재','업무 제안은 승인되기 전까지 실제 프로젝트에 적용되지 않습니다.',`<button class="btn" onclick="decisionEditor()">+ 안건 작성</button>`)+`<div class="two">${x.decisions.map(r=>`<article class="panel"><div class="row"><h3>${esc(r.subject)}</h3>${badge(r.status)}</div><p class="feature-text">${esc(r.proposal)}</p><p class="metric">제안: ${esc(r.created_at)}</p>${r.decision_note?`<p class="metric">결재 메모: ${esc(r.decision_note)}</p>`:''}${r.status==='pending'?`<div class="actions"><button class="btn mini" onclick="reviewExecutive('decisions',${r.id},'approved')">승인</button><button class="btn danger mini" onclick="reviewExecutive('decisions',${r.id},'rejected')">반려</button></div>`:''}</article>`).join('')||'<div class="empty">아직 결재 안건이 없습니다.</div>'}</div>`}
function calendar(){const x=store.executive;return heading('회사 일정 · 회의실','회의·마감·검수 일정을 등록하고 진행 상황을 확인합니다.',`<button class="btn" onclick="calendarEditor()">+ 일정 등록</button>`)+`<div class="two">${x.events.map(ev=>`<article class="panel"><div class="row"><h3>${esc(ev.title)}</h3>${badge(ev.status)}</div><p class="metric">${esc(ev.event_date)} ${esc(ev.event_time||'')} · ${esc(ev.category)}</p><p class="feature-text">${esc(ev.description||'')}</p>${ev.status==='scheduled'?`<div class="actions"><button class="btn mini" onclick="setCalendar(${ev.id},'completed')">완료</button><button class="btn alt mini" onclick="setCalendar(${ev.id},'cancelled')">취소</button></div>`:''}</article>`).join('')||'<div class="empty">아직 일정이 없습니다.</div>'}</div><section class="panel" style="margin-top:16px"><h2>최근 출퇴근 기록</h2>${x.past_days.map(d=>`<div class="activity"><span class="bullet">◷</span><div><p>${esc(d.work_date)} · ${d.ended_at?'퇴근 완료':'근무 중'}</p><small>${esc(d.focus||'')} ${esc(d.end_summary||'')}</small></div></div>`).join('')||'<div class="empty">아직 근무 기록이 없습니다.</div>'}</section>`}
function automation(){const a=store.automation,jobs=a.jobs||[];return heading('AI 직원 활동 현황','실제 GitHub 커밋을 감지하여 보고서 초안을 작성합니다. 코드를 수정하거나 Codex를 실행하지 않습니다.',`<span class="pill">${a.paused?'일시 중지':'백그라운드 운영 중'} · ${a.interval_seconds||300}초 주기</span>`)+`<div class="cards">${metric('작업 대기',jobs.filter(j=>j.status==='pending').length,'SQLite 영속 큐')}${metric('분석 중',jobs.filter(j=>j.status==='running').length,'부서 보고 생성')}${metric('보고 완료',jobs.filter(j=>j.status==='done').length,'검수 전 초안')}${metric('작업 오류',jobs.filter(j=>j.status==='failed').length,'재시도 가능')}</div><section class="panel"><h2>자동화 운영</h2><p class="muted">Windows 로그인 시 자동 실행은 설치형 exe에서 활성화합니다. 창을 닫으면 트레이에 남으며, PC를 끄면 중단됩니다.</p><div class="actions"><button class="btn ${a.paused?'':'danger'}" onclick="toggleAutomation(${!a.paused})">${a.paused?'AI 재개':'AI 일시 중지'}</button><button class="btn alt" onclick="toggleMonitor(${!a.monitor_enabled})">GitHub 감시 ${a.monitor_enabled?'끄기':'켜기'}</button><button class="btn alt" onclick="toggleAutostart(${!a.autostart})">Windows 자동 시작 ${a.autostart?'해제':'설정'}</button><button class="btn alt" onclick="checkGithubNow()">지금 GitHub 확인</button></div><p class="tagline">AI 보고 생성: ${store.health.ai_reports_enabled?'로컬 Ollama 사용 (응답 실패 시 사실 브리핑)':'사실 기반 브리핑 · Ollama 비활성'} · 승인은 CEO 전용입니다.</p></section><div class="two"><section class="panel"><h2>AI 부서별 현황</h2>${(a.departments||[]).map(d=>`<div class="activity"><span class="bullet">◉</span><div><p>${esc(d.name)}</p><small>대기 ${d.pending} · 분석 ${d.running} · 보고 완료 ${d.completed}</small></div></div>`).join('')}</section><section class="panel"><h2>최근 자동 작업</h2>${jobs.slice(0,15).map(j=>`<div class="activity"><span class="bullet">▤</span><div><p>${esc(j.department)} · ${esc(j.source_sha.slice(0,9))} ${badge(j.status)}</p><small>${esc(j.updated_at)} ${esc(j.error||'')}</small>${j.status==='failed'?`<button class="btn alt mini" onclick="retryJob(${j.id})">재시도</button>`:''}</div></div>`).join('')||'<div class="empty">첫 동기화 이후 새 커밋을 기다리고 있습니다.</div>'}</section></div>`}
function notifications(){const a=store.automation,n=a.notifications||[];return heading('대표 알림 센터','직원의 보고서 초안과 GitHub 변화 기록을 확인하고 결재합니다.',`<button class="btn alt" onclick="markNotificationsRead()">모두 읽음</button>`)+`<div class="two"><section class="panel"><h2>자동 부서 보고 · 대표 결재</h2>${(a.reports||[]).map(r=>`<article class="activity"><span class="bullet">▤</span><div><p>${esc(r.title)} ${badge(r.status)}</p><small>${esc(r.created_at)} · ${r.generator==='ollama'?'Ollama AI 작성':'근거 데이터 요약'}</small><p class="feature-text">${esc(r.body)}</p><details><summary class="metric">근거 커밋 확인</summary><pre style="white-space:pre-wrap;overflow:auto;max-height:200px">${esc(r.evidence_json)}</pre></details>${r.decision_note?`<p class="metric">대표 메모: ${esc(r.decision_note)}</p>`:''}${r.status==='pending'?`<div class="actions"><button class="btn mini" onclick="reviewAutoReport(${r.id},'approved')">승인</button><button class="btn danger mini" onclick="reviewAutoReport(${r.id},'rejected')">반려</button></div>`:''}</div></article>`).join('')||'<div class="empty">자동 보고서가 없습니다.</div>'}</section><section class="panel"><h2>새 소식</h2>${n.map(x=>`<div class="activity"><span class="bullet">${x.is_read?'○':'●'}</span><div><p>${esc(x.title)}</p><small>${esc(x.created_at)} · ${esc(x.kind)}</small><p class="muted">${esc(x.message)}</p></div></div>`).join('')||'<div class="empty">알림이 없습니다.</div>'}</section></div>`}
function settings(){return heading('회사 설정','SQLite 보존 · GitHub Private 저장소 · 자동 업데이트 관리')+`<div class="two"><section class="panel"><h2>경영 자동화</h2><p>Windows 자동 시작: ${store.automation.autostart?'설정됨':'미설정'}</p><p>AI 업무: ${store.automation.paused?'일시 중지':'운영 중'}</p><button class="btn alt" onclick="changePage('automation')">직원 운영 설정 열기</button><p class="muted">기존 CEO 승인·검수 절차를 유지하며 GitHub를 읽기 전용으로 분석합니다.</p></section><div class="panel"><h2>관리자 연결</h2><div class="form"><label>NORA_TOKEN</label><input type="password" id="new-token" class="input" placeholder="관리자 토큰"><button class="btn" onclick="login()">관리자로 연결</button><button class="btn alt" onclick="token='';reload()">게스트로 보기</button></div></div><div class="panel"><h2>Private GitHub 연결</h2><p class="metric">인증: ${esc(ghAuth.configured?ghAuth.source:'미설정')}</p><p class="tagline">Fine-grained PAT · Contents: Read-only · SQLite에 토큰 미저장</p><div class="form"><input id="github-pat" type="password" class="input" placeholder="github_pat_..."><div class="actions"><button class="btn mini" onclick="saveGithubToken()">토큰 연결</button><button class="btn alt mini" onclick="clearGithubToken()">토큰 해제</button></div></div></div><div class="panel"><h2>프로그램 업데이트</h2><p class="metric">현재 버전: ${esc(updateInfo.current||'0.7.0')}</p><p class="metric">최신 릴리스: ${esc(updateInfo.latest||'조회 전')}</p><div class="actions"><button class="btn alt mini" onclick="checkUpdate()">새 버전 확인</button>${updateInfo.available?'<button class="btn mini" onclick="installUpdate()">업데이트 설치</button>':''}</div><p class="tagline">Ollama 설정: %LOCALAPPDATA%\\NoraStudio\\config.json → aiReportsEnabled</p></div></div>`}
function draw(){renderNav();const pages={office,automation,notifications,reports,decisions,calendar,dashboard,projects,milestones,features,github,history,settings};$('content').innerHTML=(guest?'<div class="panel" style="border-color:#695da4;margin-bottom:18px;color:#d5cdff">게스트 모드 · 조회 전용입니다. 수정하려면 회사 설정에서 관리자 토큰으로 연결하세요.</div>':'')+pages[page]();if(guest){$('content').querySelectorAll('button[onclick]').forEach(b=>{if(/(?:Editor|setMilestone|syncGithub|reviewEditor|submitEditor|clockIn|clockOut|generateReport|reviewExecutive|decisionEditor|calendarEditor|setCalendar|toggleAutomation|toggleMonitor|toggleAutostart|checkGithubNow|retryJob|reviewAutoReport|markNotificationsRead)/.test(b.getAttribute('onclick'))){b.disabled=true;b.title='관리자 전용'}})}}
function modal(title,html){$('modal-title').textContent=title;$('modal-body').innerHTML=html;$('modal').classList.remove('hidden')};function closeModal(){$('modal').classList.add('hidden')}
const field=(name,id,value='',tag='input')=>`<label>${esc(name)}</label>${tag==='textarea'?`<textarea class="input" id="${id}">${esc(value)}</textarea>`:`<input class="input" id="${id}" value="${esc(value)}">`}`;
const opt=(items,current)=>items.map(([id,name])=>`<option value="${esc(id)}" ${String(id)===String(current)?'selected':''}>${esc(name)}</option>`).join('');
const projOptions=(value)=>opt(store.projects.map(p=>[p.id,p.name]),value);
function projectEditor(id){const p=store.projects.find(x=>x.id===id)||{};modal(id?'프로젝트 수정':'프로젝트 등록',`<div class="form">${field('이름','p-name',p.name)}${field('소개','p-desc',p.description,'textarea')}<label>개발 단계</label><select class="input" id="p-stage">${opt([['idea','기획'],['prototype','프로토타입'],['production','개발'],['testing','테스트'],['released','출시']],p.stage||'prototype')}</select>${field('로컬 Unity 프로젝트 경로 (메모)','p-path',p.repo_path)}${field('GitHub Public / Private 저장소 (owner/repo)','p-github',p.github_repo)}<button class="btn" onclick="saveProject(${id||'null'})">저장</button></div>`)}
async function saveProject(id){const body={name:$('p-name').value,description:$('p-desc').value,stage:$('p-stage').value,repo_path:$('p-path').value,github_repo:$('p-github').value};await act(async()=>{await api(id?`/projects/${id}`:'/projects',id?'PATCH':'POST',body);closeModal();await reload()})}
function milestoneEditor(){if(!store.projects.length)return toast('프로젝트부터 등록하세요.');modal('마일스톤 등록',`<div class="form"><label>프로젝트</label><select class="input" id="m-project">${projOptions(selected()||store.projects[0].id)}</select>${field('마일스톤 제목','m-title')}<label>목표 날짜 (선택)</label><input class="input" id="m-date" type="date"><button class="btn" onclick="saveMilestone()">등록</button></div>`)}
async function saveMilestone(){await act(async()=>{await api('/milestones','POST',{project_id:Number($('m-project').value),title:$('m-title').value,due_date:$('m-date').value||null});closeModal();await reload()})}
async function setMilestone(id,status){if(status==='done'&&!confirm('모든 관련 기능이 검증되었나요? 마일스톤을 완료 처리할까요?'))return;await act(async()=>{await api(`/milestones/${id}`,'PATCH',{status});await reload()})}
function featureEditor(){if(!store.projects.length)return toast('프로젝트부터 등록하세요.');modal('기능 정의 및 완료 조건',`<div class="form"><label>프로젝트</label><select class="input" id="f-project" onchange="updateMilestoneOptions()">${projOptions(selected()||store.projects[0].id)}</select><label>마일스톤</label><select class="input" id="f-milestone"></select>${field('기능 이름','f-title')}${field('검증 가능한 완료 조건 (한 줄당 한 기준)','f-criteria','','textarea')}<button class="btn" onclick="saveFeature()">등록</button></div>`);updateMilestoneOptions()}
function updateMilestoneOptions(){$('f-milestone').innerHTML=opt([['','미지정'],...store.milestones.filter(x=>x.project_id===Number($('f-project').value)).map(x=>[x.id,x.title])],'')}
async function saveFeature(){await act(async()=>{await api('/features','POST',{project_id:Number($('f-project').value),milestone_id:$('f-milestone').value?Number($('f-milestone').value):null,title:$('f-title').value,criteria:$('f-criteria').value});closeModal();await reload()})}
function submitEditor(id){modal('검수 근거 제출',`<div class="form">${field('GitHub 커밋/PR URL','s-url')}${field('구현 및 테스트 설명','s-note','','textarea')}<p class="tagline">근거 제출만으로 완료되지 않습니다. 대표가 직접 검토해야 합니다.</p><button class="btn" onclick="submitFeature(${id})">대표 검수 요청</button></div>`)}
async function submitFeature(id){await act(async()=>{await api(`/features/${id}/submit`,'POST',{evidence_url:$('s-url').value,note:$('s-note').value});closeModal();await reload()})}
function reviewEditor(id,decision){modal(decision==='accept'?'기능 검수 승인':'기능 반려',`<div class="form">${field('검수 결과 / 테스트 메모','r-note','','textarea')}<p class="tagline">자동 검증이 아닙니다. 구현을 확인한 후 승인하세요.</p><button class="btn ${decision==='reject'?'danger':''}" onclick="reviewFeature(${id},'${decision}')">${decision==='accept'?'검수 완료':'반려 확정'}</button></div>`)}
async function reviewFeature(id,decision){await act(async()=>{await api(`/features/${id}/review`,'POST',{decision,note:$('r-note').value});closeModal();await reload()})}
async function syncGithub(id){await act(async()=>{const result=await api(`/projects/${id}/github/sync`,'POST');await reload();toast(`GitHub에서 ${result.fetched}개 조회 · 새 커밋 ${result.new}개 기록`)})}
async function saveGithubToken(){const value=$('github-pat').value.trim();if(!value)return toast('GitHub 토큰을 입력하세요.');await act(async()=>{await api('/github/credentials','POST',{token:value});$('github-pat').value='';await reload();toast('GitHub 토큰을 Windows 자격 증명 관리자에 저장했습니다.')})}
async function clearGithubToken(){if(!confirm('Nora Studio가 저장한 GitHub 토큰을 삭제할까요?'))return;await act(async()=>{await api('/github/credentials','DELETE');await reload();toast('저장한 GitHub 토큰을 삭제했습니다.')})}
async function clockIn(){const focus=prompt('대표님, 오늘 가장 중요한 개발 목표를 입력하세요. (선택)','');if(focus===null)return;await act(async()=>{await api('/executive/clock-in','POST',{focus});await reload();toast('출근 완료 · 오늘의 브리핑이 작성되었습니다.')})}
async function clockOut(){const note=prompt('오늘의 성과와 내일 확인할 사항을 기록해 주세요.','');if(note===null)return;await act(async()=>{const r=await api('/executive/clock-out','POST',{note});await reload();toast('퇴근 보고 저장: '+r.summary)})}
async function generateReport(department){await act(async()=>{toast('실제 프로젝트 데이터로 부서 보고서를 작성 중입니다.');const r=await api('/executive/reports/generate','POST',{department});await reload();toast(r.generator==='ollama'?'Ollama 분석 보고서 초안이 준비되었습니다.':'사실 기반 브리핑이 준비되었습니다. AI 모델은 실행되지 않았습니다.')})}
async function reviewExecutive(type,id,decision){const note=prompt(decision==='approved'?'결재를 승인하시겠습니까? 검토 메모 (선택)':'반려 사유를 입력하세요.','');if(note===null)return;if(decision==='rejected'&&!note.trim())return toast('반려 사유를 입력하세요.');await act(async()=>{await api(`/executive/${type}/${id}/review`,'POST',{decision,note});await reload();toast('대표 결재 결과가 기록되었습니다.')})}
function decisionEditor(){modal('새 경영 결재 안건',`<div class="form">${field('안건 제목','d-subject')}${field('제안 내용 및 판단 근거','d-proposal','','textarea')}<button class="btn" onclick="saveDecision()">안건 등록</button></div>`)}
async function saveDecision(){await act(async()=>{await api('/executive/decisions','POST',{subject:$('d-subject').value,proposal:$('d-proposal').value});closeModal();await reload()})}
function calendarEditor(){modal('회사 일정 등록',`<div class="form">${field('일정 제목','c-title')}<label>날짜</label><input class="input" type="date" id="c-date"><label>시간 (선택)</label><input class="input" type="time" id="c-time"><label>분류</label><select class="input" id="c-category">${opt([['meeting','회의'],['deadline','마감'],['review','검수'],['planning','기획']],'meeting')}</select><label>프로젝트</label><select class="input" id="c-project">${opt([['','공통 일정'],...store.projects.map(p=>[p.id,p.name])],'')}</select>${field('일정 설명','c-description','','textarea')}<button class="btn" onclick="saveCalendar()">일정 등록</button></div>`)}
async function saveCalendar(){await act(async()=>{await api('/executive/calendar','POST',{title:$('c-title').value,event_date:$('c-date').value,event_time:$('c-time').value||null,category:$('c-category').value,project_id:$('c-project').value?Number($('c-project').value):null,description:$('c-description').value});closeModal();await reload()})}
async function setCalendar(id,status){await act(async()=>{await api(`/executive/calendar/${id}`,'PATCH',{status});await reload()})}
async function toggleAutomation(enabled){await act(async()=>{await api('/automation/pause','POST',{enabled});await reload()})}
async function toggleMonitor(enabled){await act(async()=>{await api('/automation/monitor','POST',{enabled});await reload()})}
async function toggleAutostart(enabled){await act(async()=>{await api('/automation/autostart','POST',{enabled});await reload()})}
async function checkGithubNow(){await act(async()=>{await api('/automation/check-now','POST');await reload();toast('GitHub 확인을 완료했습니다.')})}
async function retryJob(id){await act(async()=>{await api(`/automation/jobs/${id}/retry`,'POST');await reload()})}
async function reviewAutoReport(id,decision){const note=prompt(decision==='approved'?'보고를 승인하시겠습니까? 결재 메모 (선택)':'반려 사유를 입력하세요.','');if(note===null)return;if(decision==='rejected'&&!note.trim())return toast('반려 사유가 필요합니다.');await act(async()=>{await api(`/automation/reports/${id}/review`,'POST',{decision,note});await reload()})}
async function markNotificationsRead(){await act(async()=>{await api('/automation/notifications/read','POST');await reload()})}
async function login(){const candidate=$('new-token').value;token=candidate;try{const h=await api('/health');if(h.role!=='admin')throw Error('토큰이 필요합니다.');await reload();toast('관리자 연결 완료')}catch(ex){token='';toast('로그인 실패: '+ex.message)}}
async function checkUpdate(){await act(async()=>{updateInfo=await api('/update/check');draw();toast(updateInfo.available?'업데이트가 있습니다.':'현재 최신 버전입니다.')})}
async function installUpdate(){if(!confirm('업데이트를 다운로드하고 설치할까요? 앱이 종료됩니다.'))return;await act(async()=>{await api('/update/download','POST');await api('/update/install','POST');toast('업데이트 설치가 예약되었습니다.')})}
async function act(fn){try{await fn()}catch(ex){toast(ex.message)}}
renderNav();reload();setInterval(reload,12000);
</script></body></html>
