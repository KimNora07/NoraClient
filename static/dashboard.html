<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nora Studio — WorkOS</title>
<style>
:root{font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;color:#e9edf6;background:#0b0e15;font-size:14px;--panel:#141923;--surface:#1b2230;--line:#2c3546;--sub:#929eb2;--accent:#9a8bff}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.shell{display:flex;min-height:100vh}.sidebar{width:252px;background:#10141e;border-right:1px solid #273040;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:23px 13px;flex-shrink:0}
.brand{display:flex;gap:11px;align-items:center;padding:2px 12px 24px}.brand-mark{width:39px;height:39px;background:linear-gradient(140deg,#a494ff,#6169d3);border-radius:12px;display:grid;place-items:center;font-size:23px;color:white;box-shadow:0 8px 32px #8c79ff30}.brand-title{font-family:Manrope,sans-serif;font-weight:800;font-size:16px;letter-spacing:-.4px}.brand small{display:block;color:var(--sub);font-size:10px;letter-spacing:1.3px;margin-top:3px}
.group-title{color:#6f7d92;font-size:10px;letter-spacing:1.7px;font-weight:800;margin:17px 12px 9px}.nav{border:0;width:100%;text-align:left;padding:11px 13px;color:#99a7bc;background:transparent;border-radius:9px;display:flex;gap:11px;align-items:center;margin:2px 0;font-weight:600}.nav:hover{background:#1a2331;color:white}.nav.active{background:#272440;color:#c6bcff}.nav svg{width:18px;height:18px;stroke-width:1.8}.nav b{margin-left:auto;background:#403b62;color:#cbc0ff;border-radius:8px;padding:1px 7px;font-size:10px}
.side-footer{margin-top:auto;border-top:1px solid var(--line);padding:20px 10px 4px}.online-dot{display:inline-block;width:8px;height:8px;background:#4fd2a3;border-radius:50%;margin-right:7px}.side-footer p{color:var(--sub);font-size:11px;line-height:1.6}
.main{flex:1;min-width:0}.topbar{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#10141dcc}.crumb{color:var(--sub);font-size:13px}.crumb strong{color:#e8eaf4}.top-right{display:flex;align-items:center;gap:12px}.avatar{background:#675bd3;color:white;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.connection{color:#54d2a2;background:#19352f;border:1px solid #265347;border-radius:20px;padding:6px 12px;font-size:11px}
.content{max-width:1440px;margin:auto;padding:31px 36px}.eyebrow{color:#a89dff;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:27px}.pagehead h1{font:800 29px Manrope,sans-serif;letter-spacing:-1.2px;margin:7px 0}.subtitle{color:var(--sub);margin:0;font-size:13px;line-height:1.7}
.btn{background:#8273ed;color:#fff;border:1px solid #9f92ff;border-radius:9px;padding:10px 14px;font-weight:700}.btn:hover{background:#9689fa}.btn.secondary{background:#212b3b;border-color:#394559;color:#d0d8ea}.btn.danger{background:#3e2633;border-color:#6c3b4d;color:#feb6c6}.btn.mini{font-size:11px;padding:7px 9px}.btn.ghost{background:transparent;border-color:var(--line);color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:21px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px}.stat .label{color:#9daabe;font-size:12px}.stat .value{font:800 31px Manrope,sans-serif;margin:9px 0 2px}.stat .tiny{color:#76869c;font-size:11px}.stat .glyph{float:right;color:#8f83e8;font-size:23px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:17px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:17px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:10px}.panel-title h2{font:800 15px Manrope,sans-serif;margin:0}.muted{color:var(--sub)}.empty{color:#78889f;text-align:center;padding:35px 10px}
.project-card{border:1px solid var(--line);border-radius:12px;padding:19px;margin-bottom:10px;background:#19212e}.project-card h3{margin:3px 0 7px;font-size:16px}.progress{height:6px;background:#343d51;border-radius:9px;overflow:hidden;margin:15px 0 8px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#7e72ed,#b69eff)}
.badge{display:inline-block;font-size:10px;font-weight:800;border:1px solid #454064;background:#302d47;color:#c8bbff;border-radius:30px;padding:4px 9px}.badge.ok{background:#18392f;color:#5bdeb0;border-color:#2a5443}.badge.warn{background:#41331f;color:#f8c77b;border-color:#6c502c}.badge.off{background:#292f3d;color:#a1acc1;border-color:#414b5d}
.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #273040}.activity:last-child{border-bottom:0}.bullet{background:#353451;color:#a89dff;width:29px;height:29px;display:grid;place-items:center;border-radius:9px;flex-shrink:0}.activity p{margin:0 0 4px;font-size:12px}.activity small{color:#748398}
.agent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.agent{border:1px solid var(--line);border-radius:13px;background:#19212e;padding:20px}.agent .portrait{width:48px;height:48px;background:linear-gradient(145deg,#3d3b6b,#292e4b);border:1px solid #59537e;border-radius:15px;display:grid;place-items:center;font-size:23px;margin-bottom:12px}.agent h3{margin:0 0 5px;font-size:16px}.agent p{margin:5px 0 14px;color:var(--sub);font-size:12px}.agent .meta{font-size:12px;color:#9cabc2;display:flex;justify-content:space-between;margin-top:15px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:13px;overflow-x:auto}.lane{background:#111722;border:1px solid var(--line);padding:12px;border-radius:12px;min-height:330px}.lane h3{font-size:12px;color:#bfcae1;letter-spacing:.2px;margin:4px 4px 17px}.task{background:#1d2635;border:1px solid #343f52;padding:14px;border-radius:9px;margin-bottom:10px}.task h4{font-size:13px;margin:8px 0;line-height:1.5}.task p{font-size:11px;color:var(--sub);line-height:1.5}.task footer{display:flex;justify-content:space-between;align-items:center;color:#8293ae;font-size:10px;margin-top:12px}.task details pre{font-size:10px;white-space:pre-wrap;word-break:break-word;max-height:250px;overflow:auto}
.form{display:grid;gap:11px}.form label{font-size:12px;color:#b8c4d8}.input{width:100%;background:#111721;border:1px solid #3a4558;border-radius:8px;color:#eff2fa;padding:11px 12px;outline:0}.input:focus{border-color:#8e83ee}.form textarea{min-height:86px;resize:vertical}.form select{appearance:auto}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.approval{background:#1b2431;border:1px solid #354153;border-radius:12px;padding:19px;margin:10px 0}.approval h3{margin:7px 0}.approval p{font-size:12px;line-height:1.6;color:#a8b6ca}.approval .actions{display:flex;gap:5px;margin-top:13px}.footer-hint{font-size:11px;color:#77879e;margin-top:16px;line-height:1.6}.modal-backdrop{position:fixed;inset:0;background:#03060ac9;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;background:#1a2230;border:1px solid #46526b;border-radius:18px;padding:25px;box-shadow:0 30px 90px #0009}.modal h2{margin-top:0}.hidden{display:none!important}.toast{position:fixed;bottom:25px;right:25px;background:#334262;border:1px solid #6b75ad;border-radius:11px;padding:13px 20px;z-index:20;max-width:450px;box-shadow:0 12px 35px #0008}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:760px){.sidebar{width:64px;padding:17px 7px}.brand{padding:0 5px 20px}.brand-title,.brand small,.group-title,.nav span,.nav b,.side-footer{display:none}.nav{justify-content:center;padding:12px}.content{padding:24px 15px}.topbar{padding:0 15px}.agent-grid{grid-template-columns:1fr}.pagehead h1{font-size:24px}}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat .value{font-size:24px}.formrow{grid-template-columns:1fr}}
</style></head><body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-title">Nora Studio</div><small>AI WORKSPACE</small></div></div><div class="group-title">WORKSPACE</div><nav id="navigation"></nav><div class="side-footer"><div><span class="online-dot"></span><strong style="font-size:12px">Local Workspace</strong></div><p>승인된 작업만 AI가 실행합니다.<br>대표: 노라</p></div></aside>
<div class="main"><header class="topbar"><div class="crumb">Nora Studio <span style="padding:0 10px;color:#4f5a72">/</span> <strong id="breadcrumb">대시보드</strong></div><div class="top-right"><span id="server-state" class="connection">연결 필요</span><span class="avatar">N</span></div></header><main class="content" id="content"></main></div></div>
<div id="modal" class="modal-backdrop hidden"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modal-title"></h2><button class="btn ghost mini" onclick="closeModal()">닫기 ✕</button></div><div id="modal-body"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const NAV=[['dashboard','◫','CEO 대시보드'],['projects','▦','프로젝트'],['tasks','☷','업무 관리'],['agents','♙','AI 직원'],['approvals','✓','전자결재'],['settings','⚙','설정']];
let screen='dashboard',token='',guest=false,store={tasks:[],projects:[],agents:[],approvals:{pending:[],history:[]},dashboard:null,health:null};
let releaseInfo={configured:false,available:false,current:'0.4.0'},updateBusy=false;
const $=id=>document.getElementById(id),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusName={draft:'승인 대기',approved:'실행 대기',running:'개발 중',review:'최종 검토',done:'완료',failed:'실패',rejected:'반려',interrupted:'중단',changes_requested:'수정 요청',disabled:'비활성'};
const workflowPercent=t=>t.status==='done'?100:Math.max(0,Math.min(85,Number(t.progress)||0));
const when=x=>{if(!x)return '기록 없음';const d=new Date(x);return Number.isNaN(d.getTime())?String(x):d.toLocaleString('ko-KR')};
function taskProgress(t){const value=workflowPercent(t),code=t.code_percent;let changed=[];try{const parsed=JSON.parse(t.changed_files||'[]');if(Array.isArray(parsed))changed=parsed}catch{}const hasReport=code!==null&&code!==undefined;return `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:11px;gap:8px"><strong style="color:#d6cfff">AI 보고 구현 기준 충족률</strong><strong style="color:#c8baff">${hasReport?`${Math.max(0,Math.min(100,Number(code)||0))}%`:'측정 대기'}</strong></div><div class="progress" style="margin:6px 0 8px"><span style="width:${hasReport?Math.max(0,Math.min(100,Number(code)||0)):0}%"></span></div><div style="font-size:11px;color:#a9b7cf;line-height:1.6">${hasReport?`근거 파일이 확인된 완료 조건 ${Number(t.code_completed)||0}/${Number(t.code_total)||0}개`:'완료 조건별 근거 보고가 아직 없습니다.'}<br>Git 변경 파일 ${changed.length}개 ${changed.length?`<details><summary style="cursor:pointer;color:#b9a9ff">변경 파일 보기</summary>${changed.slice(0,20).map(f=>`<div>${e(f)}</div>`).join('')}</details>`:''}<br>마지막 Codex 출력: ${e(when(t.last_activity||t.updated_at))}</div><div style="font-size:10px;color:#dfbc7e;margin-top:5px">※ AI 자기 보고 + Git 파일 확인입니다. 기능 검증이나 테스트 통과를 보장하지 않습니다.</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#7f90ac;margin-top:10px"><span>${e(t.current_step||statusName[t.status]||'대기')}</span><span>업무 절차 ${value}%</span></div></div>`}
const badge=(name,type='')=>`<span class="badge ${type}">${e(name)}</span>`;
const title=(name,desc,action='')=>`<header class="pagehead"><div><div class="eyebrow">NORA STUDIO · WORKSPACE</div><h1>${e(name)}</h1><p class="subtitle">${e(desc)}</p></div>${action}</header>`;
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4000)}
async function api(path,method='GET',data){if(method!=='GET'&&!token)throw Error('게스트는 열람만 가능합니다. 설정에서 관리자 토큰으로 로그인하세요.');const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json',...(token?{'X-Nora-Token':token}:{})},body:data===undefined?undefined:JSON.stringify(data)});const obj=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof obj.detail==='string'?obj.detail:'요청 실패');return obj}
function navigate(name){screen=name;renderNav();render()}
function renderNav(){$('navigation').innerHTML=NAV.map(([id,icon,label],i)=>`${i===4?'<div class="group-title">MANAGEMENT</div>':''}<button class="nav ${screen===id?'active':''}" onclick="navigate('${id}')"><span style="display:grid;place-items:center;font-size:19px;width:20px">${icon}</span><span>${label}</span>${id==='approvals'&&store.dashboard?.pending_approvals?`<b>${store.dashboard.pending_approvals}</b>`:''}</button>`).join('');$('breadcrumb').textContent=NAV.find(x=>x[0]===screen)?.[2]||''}
async function refresh(){try{const [tasks,projects,agents,approvals,dashboard,health]=await Promise.all(['/tasks','/projects','/agents','/approvals','/dashboard','/health'].map(x=>api(x)));Object.assign(store,{tasks,projects,agents,approvals,dashboard,health});guest=health.role==='guest';$('server-state').textContent=guest?'게스트 · 읽기 전용':health.codex_enabled?'관리자 · Codex 허용':'관리자 · 안전 모드';renderNav();render()}catch(err){toast('연결 오류: '+err.message)}}
function render(){const opened=new Set([...$('content').querySelectorAll('details[data-task-log][open]')].map(x=>x.dataset.taskLog));const pages={dashboard:dashboardPage,projects:projectsPage,tasks:tasksPage,agents:agentsPage,approvals:approvalsPage,settings:settingsPage};$('content').innerHTML=pages[screen]();$('content').querySelectorAll('details[data-task-log]').forEach(x=>{if(opened.has(x.dataset.taskLog))x.open=true});if(guest){$('content').insertAdjacentHTML('afterbegin','<div class="panel" style="border-color:#5a5188;color:#c9c1ff;padding:13px 17px">◈ 게스트 모드 — 조회만 가능합니다. 등록·결재·실행하려면 <button class="btn mini secondary" onclick="showLogin()">관리자로 로그인</button></div>');$('content').querySelectorAll('button[onclick]').forEach(b=>{if(/^(openTaskModal|openProjectModal|openAgentModal|runNext|decide|planIdea)/.test(b.getAttribute('onclick'))){b.disabled=true;b.title='관리자 로그인이 필요합니다'}})}}
function stat(name,value,icon,detail='') {return `<div class="stat"><span class="glyph">${icon}</span><div class="label">${name}</div><div class="value">${value}</div><div class="tiny">${detail}</div></div>`}
function projectCard(p){const percent=p.task_count?Math.round(p.done_count/p.task_count*100):0;return `<article class="project-card"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${e(p.name)}</h3>${badge(p.stage)}</div><p class="muted" style="font-size:12px">${e(p.description||'프로젝트 설명 없음')}</p><div class="progress"><span style="width:${percent}%"></span></div><div style="display:flex;justify-content:space-between;color:#8fa0b5;font-size:11px"><span>${p.done_count}/${p.task_count}개 업무 완료</span><span>${percent}%</span></div></article>`}
function dashboardPage(){const d=store.dashboard||{statuses:{},recent:[],projects:0,agents:0,pending_approvals:0};return title('안녕하세요, 노라 대표님. ✦','오늘의 AI 게임 개발 스튜디오 현황입니다.',`<button class="btn" onclick="openTaskModal()">+ 업무 생성</button>`)+`<div class="stats">${stat('진행 프로젝트',d.projects,'▦','등록된 개발 프로젝트')}${stat('활성 AI 직원',d.agents,'♙','설정된 AI 직원')}${stat('승인 · 검토 대기',d.pending_approvals,'✓','대표 결정 필요')}${stat('완료 작업',d.statuses.done||0,'◉','최종 검토 완료')}</div><div class="grid2"><div><section class="panel"><div class="panel-title"><h2>프로젝트 진행 상황</h2><button class="btn ghost mini" onclick="navigate('projects')">전체 보기</button></div>${store.projects.length?store.projects.slice(0,3).map(projectCard).join(''):'<div class="empty">아직 프로젝트가 없습니다.<br><br><button class="btn" onclick="openProjectModal()">첫 프로젝트 만들기</button></div>'}</section><section class="panel"><div class="panel-title"><h2>대표 결재 대기</h2><button class="btn ghost mini" onclick="navigate('approvals')">결재함</button></div>${store.approvals.pending.slice(0,3).map(t=>`<div class="activity"><span class="bullet">✓</span><div><p><strong>#${t.id} ${e(t.title)}</strong> ${badge(statusName[t.status],t.status==='review'?'warn':'')}</p><small>${e(t.priority)} · ${e(t.created_at)}</small></div></div>`).join('')||'<div class="empty">새로운 결재 요청이 없습니다.</div>'}</section></div><div><section class="panel"><div class="panel-title"><h2>운영실장에게 업무 요청</h2>${badge('Ollama · Local','ok')}</div><p class="muted" style="font-size:12px;line-height:1.7">게임 개발 목표를 설명하면 AI 운영실장이 승인 가능한 작업 명세 초안을 작성합니다.</p><textarea id="quick-idea" class="input" rows="4" placeholder="예: Arcadia에 보물고 노드의 데이터 구조를 구현해줘"></textarea><button class="btn" onclick="planIdea('quick-idea')">✦ 업무 초안 작성</button></section><section class="panel"><div class="panel-title"><h2>최근 회사 활동</h2></div>${d.recent.map(a=>`<div class="activity"><span class="bullet">•</span><div><p>${e(a.message)}</p><small>${e(a.created_at)}</small></div></div>`).join('')||'<div class="empty">아직 활동 기록이 없습니다.</div>'}</section></div></div>`}
function projectsPage(){return title('프로젝트 관리','게임별 개발 현황과 Git 저장소를 관리합니다.',`<button class="btn" onclick="openProjectModal()">+ 새 프로젝트</button>`)+`<div class="agent-grid">${store.projects.map(projectCard).join('')||'<div class="empty">새 프로젝트를 등록해 보세요.</div>'}</div>`}
const statuses=[['draft','결재 대기'],['approved','실행 대기'],['running','개발 중'],['review','검토 대기'],['done','완료'],['failed','실패 / 중단']];
function taskCard(t){const p=store.projects.find(p=>p.id===t.project_id),a=store.agents.find(a=>a.id===t.agent_id);return `<article class="task"><small style="color:#a899ff;font-weight:700">TASK-${String(t.id).padStart(3,'0')}</small> ${badge(t.priority)}<h4>${e(t.title)}</h4><p>${e(t.description.slice(0,115))}${t.description.length>115?'…':''}</p><footer><span>${e(p?.name||'공통 업무')}</span><span>${e(a?.name||'미배정')}</span></footer>${taskProgress(t)}${t.attempt?`<small class="muted">실행 ${t.attempt}회 · Codex ${t.codex_thread_id?'연결됨':'대기'}</small>`:''}${t.status==='draft'?`<button class="btn mini" onclick="decide(${t.id},'approve')">승인 요청 확인</button>`:''}${t.status==='running'?`<button class="btn danger mini" onclick="stopTask(${t.id})">■ 작업 중단</button>`:''}${['failed','interrupted','changes_requested','disabled'].includes(t.status)?`<button class="btn mini secondary" onclick="retryTask(${t.id})">↻ 재시도 요청</button>`:''}${t.log?`<details data-task-log="${t.id}"><summary style="cursor:pointer;color:#ad9efa;font-size:11px;margin-top:9px">실행 로그</summary><pre>${e(t.log)}</pre></details>`:''}</article>`}
function tasksPage(){const lanes=[['draft','결재 대기'],['approved','실행 대기'],['running','개발 중'],['review','검토 대기'],['done','완료'],['failed','실패 · 중단']];return title('업무 관리','AI 직원의 개발 업무를 단계별로 관리합니다.',`<button class="btn secondary" onclick="runNext()">▷ 승인 업무 실행</button><button class="btn" onclick="openTaskModal()">+ 새 업무</button>`)+`<section class="panel" style="overflow:hidden"><div class="board">${lanes.map(([status,label])=>`<div class="lane"><h3>${label} <span class="muted">${store.tasks.filter(t=>status==='failed'?['failed','interrupted','changes_requested','rejected','disabled'].includes(t.status):t.status===status).length}</span></h3>${store.tasks.filter(t=>status==='failed'?['failed','interrupted','changes_requested','rejected','disabled'].includes(t.status):t.status===status).map(taskCard).join('')}</div>`).join('')}</div></section>`}
function agentsPage(){const iconFor=a=>a.provider==='codex'?'⌘':a.role.includes('Designer')?'✎':a.role.includes('QA')?'◇':'✦';return title('AI 직원 관리','직원별 역할, 모델, 작업량 및 활성 상태를 관리합니다.',`<button class="btn" onclick="openAgentModal()">+ 직원 등록</button>`)+`<div class="agent-grid">${store.agents.map(a=>{const assigned=store.tasks.filter(t=>t.agent_id===a.id&&['approved','running','review'].includes(t.status)),active=assigned.find(t=>t.status==='running')||assigned[0];return `<article class="agent"><div style="display:flex;justify-content:space-between"><div class="portrait">${iconFor(a)}</div>${badge(a.enabled?'활성':'비활성',a.enabled?'ok':'off')}</div><h3>${e(a.name)}</h3><p>${e(a.role)}</p><div style="display:flex;gap:6px">${badge(a.provider)} ${badge(a.model)}</div><div class="meta"><span>담당 활성 업무</span><strong>${a.active_tasks}건</strong></div>${active?`<p style="font-size:12px;margin-top:12px">${e(active.title)}</p>${taskProgress(active)}`:'<p class="muted" style="font-size:11px;margin-top:12px">현재 진행 중인 업무 없음</p>'}<button class="btn secondary mini" onclick="openAgentModal(${a.id})" style="margin-top:15px">직원 설정</button></article>`}).join('')}</div>`}
function approvalsPage(){const pending=store.approvals.pending;return title('전자결재','대표 승인 없이는 코드 작업이 실행되지 않습니다.')+`<div class="stats">${stat('업무 승인 대기',pending.filter(t=>t.status==='draft').length,'◫')}${stat('최종 검토 대기',pending.filter(t=>t.status==='review').length,'✓')}${stat('누적 결재 기록',store.approvals.history.length,'▤','최근 50건까지 표시')}${stat('자동 실행',store.health?.auto_run?'ON':'OFF','◉')}</div><div class="grid2"><section class="panel"><div class="panel-title"><h2>처리할 결재</h2></div>${pending.map(t=>`<article class="approval">${badge(t.status==='draft'?'개발 착수 승인':'코드 결과 검토',t.status==='review'?'warn':'')}<h3>#${t.id} ${e(t.title)}</h3><p>${e(t.description)}</p><p><strong style="color:#e9edf6">완료 조건</strong><br>${e(t.acceptance)}</p>${t.branch?`<p>브랜치: <code>${e(t.branch)}</code></p>`:''}<div class="actions">${t.status==='draft'?`<button class="btn mini" onclick="decide(${t.id},'approve')">승인</button><button class="btn danger mini" onclick="decide(${t.id},'reject')">반려</button>`:`<button class="btn mini" onclick="decide(${t.id},'complete')">검수 완료</button><button class="btn danger mini" onclick="decide(${t.id},'request-changes')">수정 요청</button>`}</div></article>`).join('')||'<div class="empty">현재 결재할 항목이 없습니다.</div>'}</section><section class="panel"><div class="panel-title"><h2>최근 결재 이력</h2></div>${store.approvals.history.map(x=>`<div class="activity"><span class="bullet">✓</span><div><p><strong>#${x.task_id}</strong> ${e(x.decision)} ${x.note?`— ${e(x.note)}`:''}</p><small>${e(x.decided_at)}</small></div></div>`).join('')||'<div class="empty">결재 이력이 없습니다.</div>'}</section></div>`}
function settingsPage(){const h=store.health||{};return title('회사 설정','안전한 로컬 운영 환경을 확인합니다.')+`<div class="grid2"><section class="panel"><div class="panel-title"><h2>시스템 연결</h2></div><p>운영 AI ${badge(h.model||'미연결')}</p><p>Codex 실행 ${badge(h.codex_enabled?'허용':'차단',h.codex_enabled?'warn':'ok')}</p><p>승인 후 자동 실행 ${badge(h.auto_run?'활성':'비활성',h.auto_run?'warn':'ok')}</p><p class="muted" style="font-size:12px">기본 Git 저장소: ${e(h.repo||'미설정')}</p><p class="footer-hint">설정은 서버 시작 전 환경 변수로 변경합니다. 화면에서 AI의 실행 권한을 임의로 높일 수 없습니다.</p></section><section class="panel"><div class="panel-title"><h2>접속 · 인증</h2></div><label class="muted">NORA_TOKEN 입력</label><input id="setting-token" class="input" type="password" placeholder="서버 실행 시 설정한 토큰" value="${e(token)}"><button class="btn" onclick="connectToken('setting-token')">연결</button><p class="footer-hint">토큰은 이 브라우저 탭 메모리에만 보관하며 로컬 저장소에 저장하지 않습니다.</p></section><section class="panel"><div class="panel-title"><h2>앱 업데이트</h2>${badge(releaseInfo.available?'새 버전 사용 가능':'업데이트 관리',releaseInfo.available?'warn':'ok')}</div><p class="muted" style="font-size:12px">현재 버전: ${e(releaseInfo.current||'0.3.3')}</p>${releaseInfo.configured?`<p>최신 버전: ${e(releaseInfo.latest||'확인 대기')}</p><p class="muted" style="font-size:11px;white-space:pre-wrap">${e((releaseInfo.notes||'').slice(0,600))}</p>`:'<p class="muted" style="font-size:12px">먼저 config.json의 releaseRepo에 GitHub 공개 저장소를 입력하세요.</p>'}<div class="actions"><button class="btn secondary mini" onclick="checkUpdate()" ${updateBusy?'disabled':''}>새 버전 확인</button>${releaseInfo.available?`<button class="btn mini" onclick="installLatestUpdate()" ${updateBusy?'disabled':''}>다운로드 후 업데이트</button>`:''}</div><p class="footer-hint">업데이트는 대표 승인 후 설치됩니다. Codex 작업 중에는 설치하지 않습니다. 기존 SQLite 데이터와 설정은 유지됩니다.</p></section></div>`}
async function checkUpdate(quiet=false){if(!token)return;try{releaseInfo=await api('/update/check');if(!quiet)toast(releaseInfo.available?'새 버전이 있습니다.':'현재 최신 버전입니다.');if(screen==='settings')render()}catch(err){if(!quiet)toast('업데이트 확인 실패: '+err.message)}}
async function installLatestUpdate(){if(updateBusy)return;if(!confirm(`Nora Studio ${releaseInfo.latest} 업데이트를 다운로드하고 설치할까요? 현재 앱이 종료됩니다.`))return;updateBusy=true;render();try{toast('업데이트 다운로드 및 SHA-256 검증 중입니다. 잠시 기다려 주세요.');await api('/update/download','POST');await api('/update/install','POST');toast('검증 완료. 앱 종료 후 설치하고 다시 시작합니다.')}catch(err){toast('업데이트 실패: '+err.message);updateBusy=false;render()}}
function modal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
const field=(label,id,placeholder='',value='',tag='input')=>`<label>${label}</label>${tag==='textarea'?`<textarea id="${id}" class="input" placeholder="${e(placeholder)}">${e(value)}</textarea>`:`<input id="${id}" class="input" value="${e(value)}" placeholder="${e(placeholder)}">`}`;
function options(items,value){return items.map(x=>`<option value="${e(x[0])}" ${String(x[0])===String(value)?'selected':''}>${e(x[1])}</option>`).join('')}
function openProjectModal(){modal('새 프로젝트 등록',`<div class="form">${field('프로젝트 이름','p-name','Project Arcadia')}${field('프로젝트 설명','p-desc','게임 설명','','textarea')}<label>단계</label><select class="input" id="p-stage">${options([['idea','아이디어'],['prototype','프로토타입'],['production','제작'],['testing','테스트'],['released','출시']],'prototype')}</select>${field('Git 저장소 경로 (선택)','p-repo','C:\\Projects\\Arcadia')}<button class="btn" onclick="saveProject()">프로젝트 저장</button></div>`)}
async function saveProject(){try{await api('/projects','POST',{name:$('p-name').value,description:$('p-desc').value,stage:$('p-stage').value,repo_path:$('p-repo').value});closeModal();await refresh();toast('프로젝트를 등록했습니다.')}catch(err){toast(err.message)}}
function openTaskModal(){modal('새 업무 생성',`<div class="form">${field('업무 제목','t-title','보물고 노드 구현')}${field('요구사항','t-desc','구현할 범위를 명확히 작성','','textarea')}${field('완료 조건','t-accept','검증 가능한 조건','','textarea')}<div class="formrow"><div><label>프로젝트</label><select id="t-project" class="input">${options([['','공통 업무'],...store.projects.map(p=>[p.id,p.name])],'')}</select></div><div><label>담당 AI</label><select id="t-agent" class="input">${options([['','미배정'],...store.agents.map(a=>[a.id,a.name])],store.agents.find(a=>a.provider==='codex')?.id||'')}</select></div></div><label>우선순위</label><select id="t-priority" class="input">${options([['low','낮음'],['medium','보통'],['high','높음'],['critical','긴급']],'medium')}</select><button class="btn" onclick="saveTask()">초안 등록 (실행 안 함)</button></div>`)}
async function saveTask(){try{await api('/tasks','POST',{title:$('t-title').value,description:$('t-desc').value,acceptance:$('t-accept').value,project_id:$('t-project').value?Number($('t-project').value):null,agent_id:$('t-agent').value?Number($('t-agent').value):null,priority:$('t-priority').value});closeModal();await refresh();toast('업무 초안을 저장했습니다. 승인 전까지 실행되지 않습니다.')}catch(err){toast(err.message)}}
function openAgentModal(id){const a=store.agents.find(a=>a.id===id);modal(a?'AI 직원 설정':'AI 직원 등록',`<div class="form">${field('직원 이름','a-name','AI 기획자',a?.name)}${field('직책','a-role','Game Designer',a?.role)}<label>실행 제공자</label><select id="a-provider" class="input">${options([['ollama','Ollama (로컬)'],['codex','Codex']],a?.provider||'ollama')}</select>${field('모델','a-model','qwen3:8b',a?.model)}${field('직무 지침','a-instruction','업무 범위와 금지 사항',a?.instructions,'textarea')}<label><input type="checkbox" id="a-enabled" ${a?.enabled!==0?'checked':''}> 직원 활성화</label><button class="btn" onclick="saveAgent(${id||'null'})">저장</button></div>`)}
async function saveAgent(id){const payload={name:$('a-name').value,role:$('a-role').value,provider:$('a-provider').value,model:$('a-model').value,instructions:$('a-instruction').value,enabled:$('a-enabled').checked};try{await api(id?`/agents/${id}`:'/agents',id?'PATCH':'POST',payload);closeModal();await refresh();toast('직원 설정을 저장했습니다.')}catch(err){toast(err.message)}}
async function decide(id,action){const note=prompt(action==='approve'?'업무 실행을 승인하시겠습니까? 결재 메모 (선택)':action==='complete'?'코드를 직접 검토하고 작업 완료를 승인하시겠습니까? 병합은 자동 수행되지 않습니다.':'결재 사유 또는 수정 지시를 입력하세요 (선택)');if(note===null)return;try{await api(`/tasks/${id}/${action}`,'POST',{note});await refresh();toast('결재 처리가 완료되었습니다.')}catch(err){toast(err.message)}}
async function runNext(){if(!confirm('승인된 Codex 업무 하나를 실행할까요? 파일과 명령이 변경될 수 있습니다.'))return;try{await api('/run-next','POST');toast('실행 요청을 보냈습니다.');setTimeout(refresh,1200)}catch(err){toast(err.message)}}
async function stopTask(id){if(!confirm(`TASK-${id}의 Codex 작업을 중단할까요? 변경 파일은 별도 Git 작업 공간에 보존됩니다.`))return;try{await api(`/tasks/${id}/stop`,'POST');toast('중단 요청을 전송했습니다.');await refresh()}catch(err){toast(err.message)}}
async function retryTask(id){if(!confirm(`TASK-${id}을 재시도 대기로 전환할까요? 이전 작업 공간은 보존되며 다시 대표 승인이 필요합니다.`))return;try{await api(`/tasks/${id}/retry`,'POST');toast('재시도 초안으로 전환했습니다. 다시 승인해 주세요.');await refresh()}catch(err){toast(err.message)}}
async function planIdea(inputId){const idea=$(inputId).value.trim();if(!idea){toast('목표를 입력해 주세요.');return}toast('AI 운영실장이 업무 초안을 작성하고 있습니다…');try{const p=await api('/plan','POST',{idea});openTaskModal();$('t-title').value=p.title;$('t-desc').value=p.description;$('t-accept').value=p.acceptance;toast('업무 초안이 작성되었습니다. 내용을 검토하세요.')}catch(err){toast('Ollama 오류: '+err.message)}}
function connectToken(id){token=$(id).value.trim();refresh()}
function showLogin(){modal('Nora Studio 접속',`<div class="form"><p class="muted">관리자 토큰으로 로그인하거나, 토큰 없이 게스트로 둘러볼 수 있습니다. 게스트는 업무를 변경하거나 AI를 실행할 수 없습니다.</p><input class="input" id="login-token" type="password" placeholder="관리 토큰 (선택)" autofocus><button class="btn" onclick="login()">관리자로 입장</button><button class="btn secondary" onclick="loginGuest()">게스트로 입장 (읽기 전용)</button></div>`)}
async function loginGuest(){token='';guest=true;closeModal();await refresh();toast('게스트 모드로 입장했습니다.')}
async function login(){const attempted=$('login-token').value;try{token=attempted;if(!token)throw Error('토큰을 입력하거나 게스트로 입장하세요.');await api('/health');closeModal();await refresh();checkUpdate(true)}catch(err){token='';toast('접속 실패: '+err.message)}}
renderNav();render();showLogin();setInterval(()=>{if(guest||token)refresh()},5000);
</script></body></html>
